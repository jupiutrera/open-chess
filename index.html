<!doctype html>
<html lang="es" data-pieces="staunty">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#262421" />
    <title>Open Chess · Free chess training</title>
    <meta name="description" content="Free, open-source chess training that runs on your device: Stockfish game review, 13 bots, 104,000 puzzles, an opening trainer and lessons. No ads, no account." />
    <link rel="canonical" href="https://jupiutrera.github.io/open-chess/" />
    <!-- link previews in chats and social networks need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Chess" />
    <meta property="og:title" content="Open Chess · Free chess training" />
    <meta property="og:description" content="Stockfish game review, 13 bots, 104,000 puzzles, openings and lessons. Free, offline and open source." />
    <meta property="og:url" content="https://jupiutrera.github.io/open-chess/" />
    <meta property="og:image" content="https://jupiutrera.github.io/open-chess/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- tells search engines this is a free app, for richer results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Open Chess",
        "url": "https://jupiutrera.github.io/open-chess/",
        "image": "https://jupiutrera.github.io/open-chess/og.png",
        "description": "Free, open-source chess training that runs on your device: Stockfish game review, bots, puzzles, an opening trainer and lessons.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web, Android",
        "inLanguage": ["en", "es", "fr", "it", "zh", "ja"],
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "downloadUrl": "https://github.com/jupiutrera/open-chess/releases/latest"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
