name: Android release

# Builds a signed APK for a release tag and attaches it to the GitHub release.
# release-please.yml calls it right after creating a release; run it by hand to rebuild an older tag.
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.5.0
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore secrets to publish a signed APK."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          # keep the write token out of .git/config, where install scripts could read it
          persist-credentials: false
      - name: Check the version matches the tag
        # build.gradle reads versionName from package.json and derives versionCode from it
        run: |
          pkg=$(node -p "require('./package.json').version")
          # older letter follow-ups were tagged v0.2.0b with 0.2.0-b in package.json
          want=$(echo "${TAG#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)([a-z])$/\1-\2/')
          if [ "$pkg" != "$want" ]; then
            echo "::error::Tag $TAG needs package.json $want, found $pkg"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OC_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$OC_KEYSTORE_FILE"
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/open-chess-$TAG.apk"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Open Chess $TAG" --generate-notes
          gh release upload "$TAG" "$RUNNER_TEMP/open-chess-$TAG.apk" --clobber
