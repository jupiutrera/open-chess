name: Android release

# Builds a signed APK for every version tag and attaches it to the GitHub release.
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore secrets to publish a signed APK."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Check the version matches the tag
        # Android refuses an update whose versionCode isn't higher than the installed one
        run: |
          name=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          code=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          pkg=$(node -p "require('./package.json').version")
          # npm needs semver: a letter follow-up tagged v0.2.0b is 0.2.0-b in package.json
          want=$(echo "${TAG#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)([a-z])$/\1-\2/')
          if [ "v$name" != "$TAG" ] || [ "$pkg" != "$want" ]; then
            echo "::error::Tag $TAG needs versionName ${TAG#v} and package.json $want, found $name and $pkg"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            prevCode=$(git show "$prev:android/app/build.gradle" | sed -n 's/.*versionCode \([0-9]*\).*/\1/p')
            if [ -n "$prevCode" ] && [ "$code" -le "$prevCode" ]; then
              echo "::error::versionCode $code is not higher than $prevCode in $prev"
              exit 1
            fi
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OC_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$OC_KEYSTORE_FILE"
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/open-chess-$TAG.apk"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Open Chess $TAG" --generate-notes
          gh release upload "$TAG" "$RUNNER_TEMP/open-chess-$TAG.apk" --clobber
